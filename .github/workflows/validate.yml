name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python helpers
        run: |
          python3 -m py_compile \
            skills/entity-router/scripts/*.py \
            skills/entity-env-build/scripts/*.py \
            skills/entity-nt2py/scripts/*.py

      - name: Test package contracts
        run: python3 -m unittest discover -s tests -v

      - name: Test entity-env-build
        run: python3 -m unittest discover -s skills/entity-env-build/tests -v

      - name: Check skill frontmatter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              "entity-router",
              "entity-pgen",
              "entity-env-build",
              "entity-nt2py",
          }
          found = set()
          for path in sorted(Path("skills").glob("*/SKILL.md")):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  raise SystemExit(f"{path}: missing YAML frontmatter")
              frontmatter = text.split("---\n", 2)[1]
              fields = {}
              for line in frontmatter.splitlines():
                  if ":" in line:
                      key, value = line.split(":", 1)
                      fields[key.strip()] = value.strip()
              name = fields.get("name")
              description = fields.get("description")
              if not name or not description:
                  raise SystemExit(f"{path}: name and description are required")
              if name != path.parent.name:
                  raise SystemExit(f"{path}: name must match directory")
              found.add(name)
          if found != expected:
              raise SystemExit(f"skill set mismatch: expected {expected}, found {found}")
          PY
